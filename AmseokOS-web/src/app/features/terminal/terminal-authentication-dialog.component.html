<h2 mat-dialog-title>{{ 'terminal.useTerminal' | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="authenticate()">
  <mat-dialog-content>
    <p class="terminal-auth__description">{{ 'terminal.authenticationDescription' | translate }}</p>

    <app-password-field
      [label]="'terminal.adminPassword' | translate"
      autocomplete="current-password"
      [control]="form.controls.password"
    />

    @if (errorMessage()) {
      <p class="terminal-auth__error" role="alert">{{ errorMessage() ?? '' | translate }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined" [disabled]="submitting()">
      {{ 'terminal.cancel' | translate }}
    </button>
    <button mat-flat-button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="18" />
        {{ 'terminal.authenticating' | translate }}
      } @else {
        {{ 'terminal.authenticateAndOpen' | translate }}
      }
    </button>
  </mat-dialog-actions>
</form>
