<form
  class="terminal-auth"
  aria-label="验证 Web 管理员密码"
  [formGroup]="form"
  (ngSubmit)="authenticate()"
>
  <section class="terminal-auth__content">
    <p class="terminal-auth__description">需要输入 Web admin 管理员密码进行验证</p>

    <app-password-field
      label="Web admin 管理员密码"
      autocomplete="current-password"
      [control]="form.controls.password"
    />

    @if (errorMessage()) {
      <p class="terminal-auth__error" role="alert">{{ errorMessage() }}</p>
    }
  </section>

  <footer class="terminal-auth__actions">
    <button mat-button type="button" [disabled]="submitting()" (click)="cancel()">
      取消
    </button>
    <button mat-flat-button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="18" />
        正在验证
      } @else {
        验证并打开
      }
    </button>
  </footer>
</form>
