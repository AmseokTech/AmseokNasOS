<div class="settings-layout">
  <nav class="settings-sidebar" [attr.aria-label]="'settings.categories' | translate">
    <h1>{{ 'settings.title' | translate }}</h1>
    <button
      type="button"
      [class.settings-sidebar__item--active]="activeSection() === 'about'"
      [attr.aria-current]="activeSection() === 'about' ? 'page' : null"
      (click)="selectSection('about')"
    >
      <span class="settings-sidebar__icon settings-sidebar__icon--about" aria-hidden="true">A</span>
      {{ 'settings.about' | translate }}
    </button>
    <button
      type="button"
      [class.settings-sidebar__item--active]="activeSection() === 'network'"
      [attr.aria-current]="activeSection() === 'network' ? 'page' : null"
      (click)="selectSection('network')"
    >
      <span class="settings-sidebar__icon settings-sidebar__icon--network" aria-hidden="true">
        <i></i><i></i><i></i>
      </span>
      {{ 'settings.network' | translate }}
    </button>
    <button
      type="button"
      [class.settings-sidebar__item--active]="activeSection() === 'storage'"
      [attr.aria-current]="activeSection() === 'storage' ? 'page' : null"
      (click)="selectSection('storage')"
    >
      <span class="settings-sidebar__icon settings-sidebar__icon--storage" aria-hidden="true">
        <i></i><i></i><i></i>
      </span>
      {{ 'settings.storage' | translate }}
    </button>
    <button
      type="button"
      [class.settings-sidebar__item--active]="activeSection() === 'language'"
      [attr.aria-current]="activeSection() === 'language' ? 'page' : null"
      (click)="selectSection('language')"
    >
      <span class="settings-sidebar__icon settings-sidebar__icon--language" aria-hidden="true">文</span>
      {{ 'settings.language' | translate }}
    </button>
  </nav>

  <main class="settings-content">
    @switch (activeSection()) {
      @case ('network') {
        <app-network-settings />
      }
      @case ('storage') {
        <app-disk-management />
      }
      @case ('language') {
        <app-language-settings />
      }
      @default {
        <app-about-settings />
      }
    }
  </main>
</div>
