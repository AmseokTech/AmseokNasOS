<nav class="dock" aria-label="应用程序 Dock">
  <button
    class="dock-item dock-item--launcher"
    type="button"
    [class.dock-item--selected]="launcherOpen()"
    [attr.aria-pressed]="launcherOpen()"
    aria-label="启动台"
    (click)="launcherToggled.emit()"
  >
    <span class="dock-tooltip" aria-hidden="true">启动台</span>
    <span class="dock-icon launcher-icon" aria-hidden="true">
      @for (tile of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track tile) {
        <span></span>
      }
    </span>
  </button>

  @for (app of apps(); track app.id) {
    @let appWindow = windowState(app.id);
    @let focused = isFocused(appWindow);
    @let selected = selectedAppId() === app.id;
    <button
      class="dock-item"
      type="button"
      [class.dock-item--selected]="selected"
      [class.dock-item--running]="!!appWindow"
      [class.dock-item--minimized]="appWindow?.displayState === 'minimized'"
      [class.dock-item--focused]="focused"
      [attr.aria-current]="!appWindow && selected ? 'page' : null"
      [attr.aria-pressed]="appWindow ? focused : null"
      [attr.aria-label]="app.label"
      (click)="appSelected.emit(app)"
    >
      <span class="dock-tooltip" aria-hidden="true">{{ app.label }}</span>
      <span class="dock-icon" [style.background]="app.iconBackground" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path [attr.d]="app.iconPath" />
        </svg>
      </span>
      <span class="active-dot" aria-hidden="true"></span>
    </button>
  }
</nav>
