<main class="desktop">
  <app-top-bar [activeApp]="activeAppLabel()" />

  @if (session()?.mustChangePassword) {
    <div class="desktop-reminders">
      <app-reminder-popover [title]="'shell.passwordReminderTitle' | translate" tone="warning">
        <p>{{ 'shell.passwordReminderBody' | translate }}</p>
        <a reminder-actions mat-flat-button routerLink="/change-password">
          {{ 'shell.changePasswordNow' | translate }}
        </a>
      </app-reminder-popover>
    </div>
  }

  <section class="desktop-workspace" [attr.aria-label]="'shell.desktop' | translate">
    <app-window-host />

    <div class="desktop-identity" aria-hidden="true">
      <p>AmseokOS</p>
      <small>{{ 'shell.tagline' | translate }}</small>
    </div>
  </section>

  <app-dock
    [apps]="apps"
    [selectedAppId]="selectedApp().id"
    (appSelected)="selectApp($event)"
  />
</main>
