<main class="password-page">
  <section class="password-panel" aria-labelledby="password-title">
    <p class="product-name">AmseokOS</p>
    <app-user-avatar class="password-avatar" />

    <h1 id="password-title">{{ 'auth.setNewPassword' | translate }}</h1>
    <p class="password-guidance">
      {{ 'auth.setNewPasswordDescription' | translate }}
    </p>

    <form
      class="password-form"
      [formGroup]="changePasswordForm"
      (ngSubmit)="submitPasswordChange()"
      novalidate
    >
      <app-password-field
        [control]="currentPasswordControl"
        [label]="'auth.currentPassword' | translate"
        autocomplete="current-password"
        [requiredMessage]="'auth.currentPasswordRequired' | translate"
      />
      <app-password-field
        [control]="newPasswordControl"
        [label]="'auth.newPassword' | translate"
        autocomplete="new-password"
        [requiredMessage]="'auth.newPasswordRequired' | translate"
      />
      <app-password-field
        [control]="confirmPasswordControl"
        [label]="'auth.confirmPassword' | translate"
        autocomplete="new-password"
        [requiredMessage]="'auth.confirmPasswordRequired' | translate"
      />

      <p class="password-rules">
        {{ 'auth.passwordRules' | translate }}
      </p>

      <button class="password-button" mat-flat-button type="submit" [disabled]="submitting()">
        {{ (submitting() ? 'auth.changingPassword' : 'auth.changePassword') | translate }}
      </button>

      @if (errorMessage()) {
        <p class="password-message" role="alert">{{ errorMessage() | translate }}</p>
      }
    </form>
  </section>
</main>
