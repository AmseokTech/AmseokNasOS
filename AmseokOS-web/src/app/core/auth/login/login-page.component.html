<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <p class="product-name">AmseokOS</p>
    <h1 id="login-title" class="visually-hidden">{{ 'auth.loginTitle' | translate }}</h1>

    <app-user-avatar class="login-avatar" />

    <p class="username">admin</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
      <app-password-field [control]="passwordControl" />

      <button class="login-button" mat-flat-button type="submit" [disabled]="submitting()">
        {{ (submitting() ? 'auth.loggingIn' : 'auth.login') | translate }}
      </button>

      @if (errorMessage()) {
        <p class="login-message" role="alert">{{ errorMessage() | translate }}</p>
      }
      @if (successMessage()) {
        <p class="login-message login-message--success" role="status">
          {{ successMessage() | translate }}
        </p>
      }
    </form>
  </section>
</main>
