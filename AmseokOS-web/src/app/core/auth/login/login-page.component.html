<main class="login-page">
  <section class="login-identity" aria-labelledby="login-title">
    <h1 id="login-title">AmseokOS</h1>
  </section>

  <form
    class="login-form"
    [formGroup]="loginForm"
    (ngSubmit)="submitLogin()"
    aria-label="登录 AmseokOS"
    novalidate
  >
    <label class="glass-field" for="login-username">
      <span class="visually-hidden">账户</span>
      <input
        id="login-username"
        type="text"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        maxlength="64"
        placeholder="账户"
        spellcheck="false"
        [attr.aria-invalid]="usernameControl.touched && usernameControl.invalid"
      />
    </label>

    <label class="glass-field glass-field--password" for="login-password">
      <span class="visually-hidden">密码</span>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="密码"
        [attr.aria-invalid]="passwordControl.touched && passwordControl.invalid"
      />
      <button
        class="login-button"
        type="submit"
        aria-label="登录"
        [disabled]="submitting()"
      >
        <span aria-hidden="true">{{ submitting() ? '…' : '→' }}</span>
      </button>
    </label>

    <div class="login-feedback" aria-live="polite">
      @if (usernameControl.touched && usernameControl.hasError('required')) {
        <p class="login-message" role="alert">请输入账户</p>
      } @else if (passwordControl.touched && passwordControl.hasError('required')) {
        <p class="login-message" role="alert">请输入密码</p>
      } @else if (errorMessage()) {
        <p class="login-message" role="alert">{{ errorMessage() }}</p>
      } @else if (successMessage()) {
        <p class="login-message login-message--success" role="status">{{ successMessage() }}</p>
      }
    </div>
  </form>
</main>
