<aside
  class="reminder-popover"
  [class.reminder-popover--warning]="tone() === 'warning'"
  role="alert"
  aria-live="assertive"
>
  <header class="reminder-header">
    <span class="reminder-icon" aria-hidden="true">
      @if (tone() === 'warning') {
        !
      } @else {
        i
      }
    </span>
    <h2>{{ title() }}</h2>

    @if (dismissible()) {
      <button
        class="dismiss-button"
        type="button"
        aria-label="关闭提醒"
        (click)="dismissed.emit()"
      >
        <span aria-hidden="true">×</span>
      </button>
    }
  </header>

  <div class="reminder-content">
    <ng-content />
  </div>

  <div class="reminder-actions">
    <ng-content select="[reminder-actions]" />
  </div>
</aside>
