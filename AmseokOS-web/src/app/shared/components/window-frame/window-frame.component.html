<section class="window-frame">
  <header class="window-frame__titlebar">
    <div
      class="window-frame__drag-region"
      cdkDragHandle
      (dblclick)="handleTitleBarDoubleClick($event)"
    >
      <div class="window-frame__identity">
        @if (showStatus()) {
          <span
            class="window-frame__status"
            [class.window-frame__status--busy]="statusTone() === 'busy'"
            [class.window-frame__status--online]="statusTone() === 'online'"
            [class.window-frame__status--error]="statusTone() === 'error'"
            aria-hidden="true"
          ></span>
        }
        <div>
          <strong>{{ title() | translate }}</strong>
          @if (subtitle()) {
            <small aria-live="polite">{{ subtitle() }}</small>
          }
        </div>
      </div>
    </div>

    <div class="window-frame__controls" role="group" [attr.aria-label]="'window.controls' | translate">
      <button
        class="window-frame__control window-frame__control--minimize"
        type="button"
        [title]="'window.minimize' | translate"
        [attr.aria-label]="'window.minimizeWindow' | translate"
        (click)="minimized.emit()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        class="window-frame__control window-frame__control--maximize"
        type="button"
        [title]="maximized() ? ('window.restore' | translate) : ('window.maximize' | translate)"
        [attr.aria-label]="maximized() ? ('window.restoreWindow' | translate) : ('window.maximizeWindow' | translate)"
        (click)="maximizeToggled.emit()"
      >
        <span [class.window-frame__restore-icon]="maximized()" aria-hidden="true"></span>
      </button>
      <button
        class="window-frame__control window-frame__control--close"
        type="button"
        [title]="'window.close' | translate"
        [attr.aria-label]="'window.closeWindow' | translate"
        (click)="closed.emit()"
      >
        <span aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <div class="window-frame__content">
    <ng-content></ng-content>
  </div>
</section>
