[package]
name = "amseoknas-privileged"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
nix = { version = "0.30", features = ["fs", "net", "socket", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
