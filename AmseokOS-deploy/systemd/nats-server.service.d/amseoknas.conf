#--------------------------#
#--------为 NATS 注入仓库外秘密和受管配置---------#
#--------Injects external secrets and managed configuration into NATS--------#
#-------------------------#
[Service]
EnvironmentFile=/etc/amseoknas/nats.env
ExecStart=
ExecStart=/usr/sbin/nats-server -c /usr/share/amseoknas/infrastructure/nats-server.conf
