#--------------------------#
#--------将单节点 etcd 限制在本机控制面边界---------#
#--------Restricts single-node etcd to the local control-plane boundary--------#
#-------------------------#
[Service]
Environment=ETCD_NAME=amseoknas-1
Environment=ETCD_DATA_DIR=/var/lib/etcd/amseoknas
Environment=ETCD_LISTEN_CLIENT_URLS=http://127.0.0.1:2379
Environment=ETCD_ADVERTISE_CLIENT_URLS=http://127.0.0.1:2379
Environment=ETCD_LISTEN_PEER_URLS=http://127.0.0.1:2380
Environment=ETCD_INITIAL_ADVERTISE_PEER_URLS=http://127.0.0.1:2380
Environment=ETCD_INITIAL_CLUSTER=amseoknas-1=http://127.0.0.1:2380
Environment=ETCD_INITIAL_CLUSTER_STATE=new
Environment=ETCD_INITIAL_CLUSTER_TOKEN=amseoknas-single-node
