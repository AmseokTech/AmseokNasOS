#--------------------------#
#--------为终端路径保留 WebSocket 升级和长连接---------#
#--------Preserves WebSocket upgrades and long-lived terminal connections--------#
#-------------------------#
# Include this location inside the HTTPS server block before a broader /api location.
location /api/terminal/ {
    proxy_pass http://127.0.0.1:5080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 65m;
    proxy_send_timeout 65m;
}
