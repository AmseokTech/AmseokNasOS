server {
    listen 6521 ssl;
    listen [::]:6521 ssl;
    server_name _;

    ssl_certificate /etc/amseoknas/tls/amseoknas.crt;
    ssl_certificate_key /etc/amseoknas/tls/amseoknas.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AmseokNasTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/amseoknas/web;
    index index.html;
    client_max_body_size 16m;

    location = /health/live {
        proxy_pass http://127.0.0.1:5000/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:5000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/terminal/ {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 65m;
        proxy_send_timeout 65m;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
