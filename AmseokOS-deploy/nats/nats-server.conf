#--------------------------#
#--------单节点 NATS 与 JetStream 安全边界---------#
#--------Single-node NATS and JetStream security boundary--------#
#-------------------------#
server_name: amseoknas-1
host: 127.0.0.1
port: 4222
http: 127.0.0.1:8222

jetstream {
  store_dir: $NATS_STORE_DIR
  max_file_store: 2GB
  max_memory_store: 256MB
}

authorization {
  users: [
    {
      user: $NATS_USER
      password: "$NATS_PASSWORD_HASH"
      permissions: {
        publish: ["amseoknas.>", "_INBOX.>", "$JS.API.>"]
        subscribe: ["amseoknas.>", "_INBOX.>"]
      }
    }
  ]
}

max_payload: 1MB
write_deadline: "10s"
