name: CI

on:
  pull_request:
    branches:
      - main
      - devkihon
  push:
    branches:
      - main
      - devkihon
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AmseokNas-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: AmseokNas-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AmseokNas-server
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.301

      - name: Restore solution
        run: dotnet restore AmseokNas.sln

      - name: Restore tests
        run: dotnet restore tests/Nas.Api.Tests/Nas.Api.Tests.csproj

      - name: Build solution
        run: dotnet build AmseokNas.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Nas.Api.Tests/Nas.Api.Tests.csproj --configuration Release --no-restore
