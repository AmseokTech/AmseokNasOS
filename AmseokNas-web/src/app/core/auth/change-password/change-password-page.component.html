<main class="password-page">
  <section class="password-panel" aria-labelledby="password-title">
    <p class="product-name">AmseokOS</p>
    <app-user-avatar class="password-avatar" />

    <h1 id="password-title">设置新密码</h1>
    <p class="password-guidance">
      当前使用的是初始密码。继续使用系统前，请设置一个仅由你掌握的新密码。
    </p>

    <form
      class="password-form"
      [formGroup]="changePasswordForm"
      (ngSubmit)="submitPasswordChange()"
      novalidate
    >
      <app-password-field
        [control]="currentPasswordControl"
        label="当前密码"
        autocomplete="current-password"
        requiredMessage="请输入当前密码"
      />
      <app-password-field
        [control]="newPasswordControl"
        label="新密码"
        autocomplete="new-password"
        requiredMessage="请输入新密码"
      />
      <app-password-field
        [control]="confirmPasswordControl"
        label="确认新密码"
        autocomplete="new-password"
        requiredMessage="请再次输入新密码"
      />

      <p class="password-rules">
        至少 8 位，并同时包含大写字母、小写字母、数字和特殊字符。
      </p>

      <button class="password-button" mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? '正在修改…' : '修改密码' }}
      </button>

      @if (errorMessage()) {
        <p class="password-message" role="alert">{{ errorMessage() }}</p>
      }
    </form>
  </section>
</main>
