<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <p class="product-name">AmseokOS</p>
    <h1 id="login-title" class="visually-hidden">管理员登录</h1>

    <app-user-avatar class="login-avatar" />

    <p class="username">admin</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
      <app-password-field [control]="passwordControl" />

      <button class="login-button" mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? '正在登录…' : '登录' }}
      </button>

      @if (errorMessage()) {
        <p class="login-message" role="alert">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="login-message login-message--success" role="status">{{ successMessage() }}</p>
      }
    </form>
  </section>
</main>
